<!DOCTYPE html>
<html lang="en">
<!-- spz-widget:mini_calendar -->
<head>
    <meta charset="UTF-8">
    <title>Calendar | Widget</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; background: transparent; overflow: hidden; }
        body {
            display: flex; align-items: center; justify-content: center;
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
        }
        #spz-root {
            width: 210px; height: 222px;
            transform-origin: center center;
            padding: 12px 14px 14px;
            display: flex; flex-direction: column;
        }
        .cal-head {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 8px;
        }
        .month-year {
            font-size: 13px; font-weight: 600; letter-spacing: 0.3px;
            text-transform: capitalize;
        }
        .cal-btn {
            width: 22px; height: 22px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 7px;
            color: rgba(255,255,255,0.7);
            font-size: 11px; line-height: 1;
            cursor: pointer; user-select: none;
            transition: background 0.15s, color 0.15s;
        }
        .cal-btn:hover { background: rgba(76,201,240,0.35); color: #fff; }
        .grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-auto-rows: 1fr;
            align-items: center;
            text-align: center;
        }
        .wd {
            font-size: 9px; font-weight: 600;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            padding-bottom: 4px;
        }
        .wd.we { color: rgba(76,201,240,0.55); }
        .day {
            font-size: 11px; font-weight: 500;
            height: 22px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 7px;
        }
        .day.other { opacity: 0.25; }
        .day.today {
            background: rgba(76,201,240,0.3);
            box-shadow: inset 0 0 0 1px rgba(76,201,240,0.7);
            font-weight: 700;
        }
    </style>
</head>
<body>
<div id="spz-root">
    <div class="cal-head">
        <div class="cal-btn" id="prevBtn">‹</div>
        <div class="month-year" id="monthYearDisplay"></div>
        <div class="cal-btn" id="nextBtn">›</div>
    </div>
    <div class="grid" id="calendarGrid"></div>
</div>
<script>
    (function () {
        var W = 210, H = 222;
        function fit() {
            var s = Math.min(window.innerWidth / W, window.innerHeight / H, 1);
            document.getElementById('spz-root').style.transform = 'scale(' + s + ')';
        }
        window.addEventListener('resize', fit); fit();
    })();
</script>
<script>
    var LANG = (window.__SPZ_LANG || (navigator.language || 'en').slice(0, 2).toLowerCase()) === 'ru' ? 'ru' : 'en';
    var locale = LANG === 'ru' ? 'ru-RU' : 'en-GB';
    var monthFmt = new Intl.DateTimeFormat(locale, { month: 'long', year: 'numeric' });
    // Weekday initials starting from Monday (2024-01-01 is a Monday)
    var wdFmt = new Intl.DateTimeFormat(locale, { weekday: 'short' });
    var weekdayLabels = [];
    for (var d = 1; d <= 7; d++) {
        var lbl = wdFmt.format(new Date(2024, 0, d));
        weekdayLabels.push(lbl.length > 2 ? lbl.slice(0, 2) : lbl);
    }

    var currentDate = new Date();

    function renderCalendar() {
        var year = currentDate.getFullYear();
        var month = currentDate.getMonth();
        var startWeekday = new Date(year, month, 1).getDay();       // 0 = Sun
        var offset = startWeekday === 0 ? 6 : startWeekday - 1;     // shift to Monday
        var daysInMonth = new Date(year, month + 1, 0).getDate();
        var prevMonthDays = new Date(year, month, 0).getDate();

        var grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';

        for (var i = 0; i < 7; i++) {
            var wd = document.createElement('div');
            wd.className = 'wd' + (i >= 5 ? ' we' : '');
            wd.textContent = weekdayLabels[i];
            grid.appendChild(wd);
        }

        var today = new Date();
        var isCurrent = today.getFullYear() === year && today.getMonth() === month;
        var cells = [];

        for (var p = 0; p < offset; p++) cells.push({ d: prevMonthDays - offset + 1 + p, other: true });
        for (var m = 1; m <= daysInMonth; m++) cells.push({ d: m, other: false });
        var next = 1;
        while (cells.length % 7 !== 0 || cells.length < 35) cells.push({ d: next++, other: true });

        cells.forEach(function (c) {
            var el = document.createElement('div');
            el.className = 'day' + (c.other ? ' other' : '') +
                (isCurrent && !c.other && c.d === today.getDate() ? ' today' : '');
            el.textContent = c.d;
            grid.appendChild(el);
        });

        var mo = monthFmt.format(currentDate);
        document.getElementById('monthYearDisplay').textContent = mo.charAt(0).toUpperCase() + mo.slice(1);
    }

    document.getElementById('prevBtn').addEventListener('click', function () {
        currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar();
    });
    document.getElementById('nextBtn').addEventListener('click', function () {
        currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar();
    });
    renderCalendar();
</script>
</body>
</html>
