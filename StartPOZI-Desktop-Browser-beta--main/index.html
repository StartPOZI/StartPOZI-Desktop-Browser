<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>StartPOZI Browser</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="custom-titlebar macos" id="customTitlebar">
      <div class="window-controls">
        <button id="min-btn" title="Свернуть"></button>
        <button id="max-btn" title="На весь экран"></button>
        <button id="close-btn" title="Закрыть"></button>
      </div>
    </div>

    <div class="tabs" id="tabsContainerTabs">
      <button id="addTab">+</button>
    </div>

    <div class="toolbar">
      <nav class="navigation-bar">
        <div class="nav-buttons">
          <button class="nav-btn" id="back" title="Назад">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12,19 5,12 12,5"></polyline>
            </svg>
          </button>
          <button class="nav-btn" id="forward" title="Вперёд">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12,5 19,12 12,19"></polyline>
            </svg>
          </button>
          <button class="nav-btn" id="refresh" title="Обновить">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"></path>
              <path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"></path>
            </svg>
          </button>
        </div>
      </nav>

      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Введите запрос для StartPOZI..." autocomplete="off">
        <button id="searchBtn" title="Поиск">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </div>

      <div class="menu">
        <button id="menuBtn">Menu</button>
        <div class="dropdown" id="dropdown">
          <div class="menu-item">Закладки</div>
          <div class="menu-item">Загрузки</div>
          <div class="menu-item">История</div>
          <div class="menu-item">О нас</div>
          <div class="menu-item">Настройки</div>
        </div>
      </div>
    </div>

    <div class="tabs-container" id="tabsContainer"></div>
  </div>

  <!-- КРАСИВЫЕ КАСТОМНЫЕ ДИАЛОГИ -->
  <div id="customDialogOverlay">
    <div class="dialogBox">
      <div class="dialogIcon"></div>
      <h2 id="dialogTitle">Сообщение</h2>
      <p id="dialogMessage"></p>
      <input id="dialogInput" type="text" autocomplete="off">
      <div class="dialogButtons">
        <button id="dialogCancel">Отмена</button>
        <button id="dialogOK" class="primary">ОК</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
  <script src="preload.js"></script>
</body>
</html>
