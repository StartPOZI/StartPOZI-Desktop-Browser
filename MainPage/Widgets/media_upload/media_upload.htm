<!DOCTYPE html>
<html lang="en">
<!-- spz-widget:media_upload -->
<head>
    <meta charset="UTF-8">
    <title>Media widget | Upload an image/GIF</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; background: transparent; overflow: hidden; }
        body {
            display: flex; align-items: center; justify-content: center;
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
        }
        #spz-root {
            width: 174px; height: 184px;
            transform-origin: center center;
            padding: 8px;
            display: flex; flex-direction: column; align-items: center;
        }
        .drop {
            position: relative;
            width: 100%; flex: 1;
            border: 1.5px dashed rgba(255,255,255,0.25);
            border-radius: 12px;
            background: rgba(255,255,255,0.03);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            overflow: hidden;
        }
        .drop:hover, .drop.over { border-color: rgba(76,201,240,0.7); background: rgba(76,201,240,0.08); }
        .drop img {
            max-width: 100%; max-height: 100%;
            object-fit: contain;
            display: none;
        }
        .placeholder { text-align: center; color: rgba(255,255,255,0.45); }
        .placeholder .ico { font-size: 26px; margin-bottom: 6px; }
        .placeholder .lbl { font-size: 10.5px; line-height: 1.4; padding: 0 8px; }
        .clear-btn {
            position: absolute; top: 4px; right: 4px;
            display: none;
            width: 20px; height: 20px;
            border-radius: 50%;
            border: none;
            background: rgba(10,12,18,0.75);
            color: rgba(255,255,255,0.75);
            font-size: 12px; line-height: 1;
            cursor: pointer;
            align-items: center; justify-content: center;
        }
        .clear-btn:hover { color: #ff6b6b; }
        .hint { font-size: 8.5px; color: rgba(255,255,255,0.35); margin-top: 6px; text-align: center; }
        .err { font-size: 9px; color: #ff8b8b; margin-top: 4px; height: 11px; text-align: center; }
        input { display: none; }
    </style>
</head>
<body>
<div id="spz-root">
    <div class="drop" id="dropZone">
        <img id="previewImg" alt="">
        <div class="placeholder" id="placeholder">
            <div class="ico">🖼️</div>
            <div class="lbl" id="chooseLbl"></div>
        </div>
        <button class="clear-btn" id="clearBtn" title="Remove">×</button>
    </div>
    <input type="file" id="uploadFile" accept="image/gif,image/png,image/jpeg,image/webp,image/svg+xml">
    <div class="err" id="errMsg"></div>
    <div class="hint" id="formatsHint"></div>
</div>
<script>
    (function () {
        var W = 174, H = 184;
        function fit() {
            var s = Math.min(window.innerWidth / W, window.innerHeight / H, 1);
            document.getElementById('spz-root').style.transform = 'scale(' + s + ')';
        }
        window.addEventListener('resize', fit); fit();
    })();
</script>
<script>
    var LANG = (window.__SPZ_LANG || (navigator.language || 'en').slice(0, 2).toLowerCase()) === 'ru' ? 'ru' : 'en';
    var L = function (o) { return o[LANG] || o.en; };
    document.getElementById('chooseLbl').textContent = L({ en: 'Click or drop an image', ru: 'Кликните или перетащите картинку' });
    document.getElementById('formatsHint').textContent = L({ en: 'GIF · PNG · JPG · WEBP · SVG', ru: 'GIF · PNG · JPG · WEBP · SVG' });
    document.getElementById('clearBtn').title = L({ en: 'Remove', ru: 'Убрать' });

    var drop = document.getElementById('dropZone');
    var input = document.getElementById('uploadFile');
    var preview = document.getElementById('previewImg');
    var placeholder = document.getElementById('placeholder');
    var clearBtn = document.getElementById('clearBtn');
    var errMsg = document.getElementById('errMsg');
    var KEY = 'spzcw_media_img';

    function showErr(msg) { errMsg.textContent = msg; setTimeout(function () { errMsg.textContent = ''; }, 3000); }

    function setImage(dataUrl) {
        if (dataUrl) {
            preview.src = dataUrl;
            preview.style.display = 'block';
            placeholder.style.display = 'none';
            clearBtn.style.display = 'flex';
        } else {
            preview.removeAttribute('src');
            preview.style.display = 'none';
            placeholder.style.display = 'block';
            clearBtn.style.display = 'none';
            try { localStorage.removeItem(KEY); } catch (e) {}
        }
    }

    try { setImage(localStorage.getItem(KEY) || null); } catch (e) {}

    function handleFile(file) {
        if (!file) return;
        if (!file.type || file.type.indexOf('image/') !== 0) {
            showErr(L({ en: 'Pick an image file', ru: 'Выберите файл-изображение' }));
            return;
        }
        if (file.size > 2 * 1024 * 1024) {
            showErr(L({ en: 'File is over 2 MB', ru: 'Файл больше 2 МБ' }));
            return;
        }
        var reader = new FileReader();
        reader.onload = function () {
            setImage(reader.result);
            try { localStorage.setItem(KEY, reader.result); } catch (e) {
                showErr(L({ en: 'Could not save', ru: 'Не удалось сохранить' }));
            }
        };
        reader.readAsDataURL(file);
    }

    drop.addEventListener('click', function () { input.click(); });
    input.addEventListener('change', function (e) { handleFile(e.target.files && e.target.files[0]); });
    clearBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        setImage(null);
    });
    ['dragenter', 'dragover'].forEach(function (ev) {
        drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); });
    });
    ['dragleave', 'drop'].forEach(function (ev) {
        drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); });
    });
    drop.addEventListener('drop', function (e) {
        handleFile(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]);
    });
</script>
</body>
</html>
