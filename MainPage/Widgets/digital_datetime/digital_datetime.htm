<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital time &amp; date | Widget</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 70% 30%, #1f2c3c, #0c111a);
            font-family: 'Segoe UI', 'Inter', monospace;
        }
        .widget {
            background: transparent;
            border-radius: 2rem;
            padding: 1.8rem 1.8rem;
            text-align: center;
            box-shadow: 0 20px 35px rgba(0,0,0,0.2), 0 0 0 1px rgba(255,255,210,0.12);
            max-width: 340px;
            width: 100%;
        }
        .widget-title {
            font-size: 1.7rem;
            font-weight: 600;
            background: linear-gradient(135deg, #FFF0CF, #C7DBFF);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .widget-desc {
            font-size: 0.8rem;
            color: #cbdbe6;
            margin: 0.4rem 0 1.2rem 0;
            border-left: 2px solid #ffbc6e;
            padding-left: 0.7rem;
            text-align: left;
        }
        .digital-time {
            font-size: 3.3rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            background: rgba(255,250,225,0.08);
            backdrop-filter: blur(4px);
            border-radius: 3rem;
            padding: 0.3rem 1rem;
            display: inline-block;
            letter-spacing: 3px;
            color: #F9F3D9;
        }
        .date-string {
            font-size: 1.3rem;
            margin-top: 1rem;
            font-weight: 400;
            color: #dfe8ff;
        }
    </style>
</head>
<body>
<div class="widget">
    <div class="widget-title">📆 Digital time & date</div>
    <div class="widget-desc">Exact time, day, month and year — always at a glance.</div>
    <div class="digital-time" id="clockDisplay">--:--:--</div>
    <div class="date-string" id="dateDisplay">loading...</div>
</div>
<script>
    function updateTimeAndDate() {
        const now = new Date();
        const hours = now.getHours().toString().padStart(2, '0');
        const minutes = now.getMinutes().toString().padStart(2, '0');
        const seconds = now.getSeconds().toString().padStart(2, '0');
        document.getElementById('clockDisplay').innerText = `${hours}:${minutes}:${seconds}`;

        const day = now.getDate();
        const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        const month = months[now.getMonth()];
        const year = now.getFullYear();
        document.getElementById('dateDisplay').innerHTML = `${day} ${month} ${year}`;
    }
    updateTimeAndDate();
    setInterval(updateTimeAndDate, 1000);
</script>
</body>
</html>
