<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>StartPOZI Browser</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .toolbar {
      height: 56px;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid #252525;
      position: relative;
    }

    .nav-buttons { display: flex; gap: 8px; }

    .nav-btn {
      width: 40px; height: 40px;
      background: rgba(255,255,255,0.06);
      border: none; border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center; justify-content: center;
    }
    .nav-btn:hover { background: rgba(255,255,255,0.14); }

    .search-bar {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      max-width: 620px;
      pointer-events: auto;
    }

    #searchInput {
      width: 100%;
      height: 40px;
      padding: 0 20px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 13px;
      color: white;
      font-size: 15px;
      outline: none;
      text-align: center;
    }
    #searchInput::placeholder {
      color: rgba(255,255,255,0.45);
      text-align: center;
    }
    #searchInput:focus::placeholder { opacity: 0; }

    .right-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #downloadsBtn, #menuBtn {
      width: 44px; height: 44px;
      background: rgba(255,255,255,0.07);
      border: none; border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: background-color 0.2s;
    }
    #downloadsBtn:hover, #menuBtn:hover {
      background: rgba(255,255,255,0.16);
    }

    #downloadIcon.active-download,
    #downloadIcon.new-download {
      stroke: #0a84ff !important;
      stroke-width: 2.5;
    }

    #downloadIcon {
      transition: stroke 0.3s ease, stroke-width 0.3s ease;
    }

    .dropdown {
      position: absolute;
      top: 68px;
      right: 18px;
      background: rgba(20,20,20,0.98);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      width: 260px;
      display: none;
      z-index: 99999;
      backdrop-filter: blur(20px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    .dropdown.show { display: block; }

    .menu-item {
      padding: 14px 20px;
      color: #ddd;
      font-size: 14px;
      cursor: pointer;
    }
    .menu-item:hover {
      background: rgba(255,255,255,0.08);
    }

    .separator {
      height: 1px;
      background: rgba(255,255,255,0.1);
      margin: 8px 0;
    }

    #downloadsDropdown {
      position: absolute;
      top: 68px;
      right: 70px;
      background: rgba(20,20,20,0.98);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      width: 340px;
      max-height: 500px;
      overflow-y: auto;
      display: none;
      z-index: 99999;
      padding: 12px 0;
      backdrop-filter: blur(20px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    #downloadsDropdown.show { display: block; }

    .download-item-dropdown { padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .download-item-dropdown:hover { background-color: rgba(255,255,255,0.05); }
    .download-item-dropdown.active { background: linear-gradient(90deg, rgba(32,144,255,0.05), transparent); border-left: 3px solid #2090FF; }
    .download-item-dropdown.completed { opacity: 0.8; }

    .download-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .filename { color: white; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; margin-right: 10px; }
    .status { font-size: 11px; padding: 2px 6px; border-radius: 4px; }
    .status.completed { background: rgba(76,217,100,0.2); color: #4CD964; }

    .progress-container { height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; margin: 8px 0; overflow: hidden; }
    .progress-bar { height: 100%; background: linear-gradient(90deg, #2090FF, #00C8FF); border-radius: 2px; transition: width 0.3s ease; }

    .download-details { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
    .progress-text { color: #aaa; font-size: 11px; font-family: 'Consolas', monospace; flex: 1; }
    .download-actions button { width: 24px; height: 24px; background: rgba(255,255,255,0.1); border: none; border-radius: 4px; color: #ddd; cursor: pointer; }
    .download-actions button:hover { background: rgba(255,255,255,0.2); transform: scale(1.1); }

    .no-downloads { padding: 20px; text-align: center; color: #888; font-size: 14px; }

    svg { stroke: white; fill: none; stroke-width: 2.2; }
    .nav-btn svg, #menuBtn svg { width: 18px; height: 18px; }
    #downloadIcon { width: 20px; height: 20px; }

    /* Suggest */
    #suggestions {
      position: absolute;
      top: 56px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 620px;
      background: rgba(20,20,20,0.98);
      border: 1px solid rgba(255,255,255,0.12);
      border-top: none;
      border-radius: 0 0 13px 13px;
      max-height: 300px;
      overflow-y: auto;
      z-index: 9999;
      backdrop-filter: blur(20px);
      display: none;
    }

    .suggest-item {
      padding: 10px 20px;
      color: #ddd;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }

    .suggest-item:hover {
      background: rgba(255,255,255,0.08);
    }

    .suggest-title {
      font-size: 14px;
      font-weight: 500;
    }

    .suggest-url {
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="custom-titlebar macos" id="customTitlebar">
      <div class="window-controls">
        <button id="min-btn" title="Свернуть"></button>
        <button id="max-btn" title="На весь экран"></button>
        <button id="close-btn" title="Закрыть"></button>
      </div>
    </div>

    <div class="tabs" id="tabsContainerTabs">
      <button id="addTab" title="Новая вкладка">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
    </div>

    <div class="toolbar">
      <div class="nav-buttons">
        <button class="nav-btn" id="back"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12,19 5,12 12,5"></polyline></svg></button>
        <button class="nav-btn" id="forward"><svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12,5 19,12 12,19"></polyline></svg></button>
        <button class="nav-btn" id="refresh"><svg viewBox="0 0 24 24"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"></path><path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"></path></svg></button>
      </div>

      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Поиск или адрес..." autocomplete="off">
      </div>
      <div id="suggestions"></div> <!-- Вынесено из search-bar -->

      <div class="right-buttons">
        <button id="downloadsBtn">
          <svg viewBox="0 0 24 24" id="downloadIcon">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </button>
        <button id="menuBtn">
          <svg viewBox="0 0 24 24">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <div class="tabs-container" id="tabsContainer"></div>

    <div class="dropdown" id="dropdown">
      <div class="menu-item" data-action="bookmarks">Закладки</div>
      <div class="menu-item" data-action="downloads">Загрузки</div>
      <div class="menu-item" data-action="history">История</div>
      <div class="menu-item" data-action="security-test">Тест безопасности</div>
      <div class="separator"></div>
      <div class="menu-item" data-action="about">О браузере</div>
      <div class="separator"></div>
      <div class="menu-item" data-action="settings">Настройки</div>
    </div>

    <div id="downloadsDropdown">
      <div id="downloadsListDropdown"></div>
      <div class="show-all" id="showAllDownloads" style="padding:12px; text-align:center; color:#0a84ff; cursor:pointer; border-top:1px solid rgba(255,255,255,0.1);">
        Показать все загрузки
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
