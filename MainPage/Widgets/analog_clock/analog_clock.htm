<!DOCTYPE html>
<html lang="en">
<!-- spz-widget:analog_clock -->
<head>
    <meta charset="UTF-8">
    <title>Analog clock | Widget</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; background: transparent; overflow: hidden; }
        body {
            display: flex; align-items: center; justify-content: center;
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
        }
        #spz-root { width: 170px; height: 170px; transform-origin: center center; }
        canvas { display: block; width: 170px; height: 170px; }
    </style>
</head>
<body>
<div id="spz-root"><canvas id="clockCanvas" width="340" height="340"></canvas></div>
<script>
    (function () {
        var W = 170, H = 170;
        function fit() {
            var s = Math.min(window.innerWidth / W, window.innerHeight / H, 1);
            document.getElementById('spz-root').style.transform = 'scale(' + s + ')';
        }
        window.addEventListener('resize', fit); fit();
    })();
</script>
<script>
    var canvas = document.getElementById('clockCanvas');
    var ctx = canvas.getContext('2d');

    function drawClock() {
        var now = new Date();
        var hours = now.getHours() % 12;
        var minutes = now.getMinutes();
        var seconds = now.getSeconds();
        var radius = canvas.width / 2;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);

        // Dial: soft dark glass
        ctx.beginPath();
        ctx.arc(0, 0, radius * 0.94, 0, 2 * Math.PI);
        ctx.fillStyle = 'rgba(255,255,255,0.05)';
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = 'rgba(255,255,255,0.18)';
        ctx.stroke();

        // Ticks
        for (var i = 0; i < 60; i++) {
            var a = i * Math.PI / 30;
            var major = i % 5 === 0;
            var len = major ? 16 : 7;
            ctx.beginPath();
            ctx.moveTo((radius - 14) * Math.cos(a), (radius - 14) * Math.sin(a));
            ctx.lineTo((radius - 14 - len) * Math.cos(a), (radius - 14 - len) * Math.sin(a));
            ctx.lineWidth = major ? 5 : 2.5;
            ctx.strokeStyle = major ? 'rgba(255,255,255,0.85)' : 'rgba(255,255,255,0.28)';
            ctx.stroke();
        }

        // Numbers 12 / 3 / 6 / 9
        ctx.font = '600 34px -apple-system, "Segoe UI", Roboto, sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        var nr = radius - 58;
        ctx.fillText('12', 0, -nr);
        ctx.fillText('3', nr, 0);
        ctx.fillText('6', 0, nr);
        ctx.fillText('9', -nr, 0);

        var hourAngle = (hours * 30 + minutes * 0.5) * Math.PI / 180;
        var minuteAngle = minutes * 6 * Math.PI / 180;
        var secondAngle = seconds * 6 * Math.PI / 180;

        // Hour hand
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-14 * Math.cos(hourAngle), -14 * Math.sin(hourAngle));
        ctx.lineTo(radius * 0.48 * Math.cos(hourAngle), radius * 0.48 * Math.sin(hourAngle));
        ctx.lineWidth = 11;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        // Minute hand
        ctx.beginPath();
        ctx.moveTo(-18 * Math.cos(minuteAngle), -18 * Math.sin(minuteAngle));
        ctx.lineTo(radius * 0.72 * Math.cos(minuteAngle), radius * 0.72 * Math.sin(minuteAngle));
        ctx.lineWidth = 8;
        ctx.strokeStyle = 'rgba(255,255,255,0.92)';
        ctx.stroke();

        // Second hand — accent
        ctx.beginPath();
        ctx.moveTo(-30 * Math.cos(secondAngle), -30 * Math.sin(secondAngle));
        ctx.lineTo(radius * 0.84 * Math.cos(secondAngle), radius * 0.84 * Math.sin(secondAngle));
        ctx.lineWidth = 3.5;
        ctx.strokeStyle = '#4cc9f0';
        ctx.stroke();

        // Center
        ctx.beginPath();
        ctx.arc(0, 0, 11, 0, 2 * Math.PI);
        ctx.fillStyle = '#4cc9f0';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(0, 0, 5, 0, 2 * Math.PI);
        ctx.fillStyle = 'rgba(14,16,24,0.9)';
        ctx.fill();

        ctx.restore();
    }

    drawClock();
    setInterval(drawClock, 1000);
</script>
</body>
</html>
