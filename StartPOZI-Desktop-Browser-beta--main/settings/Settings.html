<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&display=swap');

        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { height: 100%; overflow: hidden; font-family: 'SF Pro Display', -apple-system, sans-serif; }

        body {
            background: url('https://images.unsplash.com/photo-1614850715649-1d0106293bd1?w=2560&q=95') center/cover no-repeat fixed;
        }

        .window {
            width: 100vw;
            height: 100vh;
            background: rgba(20, 20, 30, 0.48);
            backdrop-filter: blur(60px) saturate(180%) brightness(1.7);
            -webkit-backdrop-filter: blur(60px) saturate(180%) brightness(1.7);
            display: flex;
        }

        .sidebar {
            width: 280px;
            background: rgba(28, 28, 38, 0.65);
            backdrop-filter: blur(40px);
            border-right: 1px solid rgba(255,255,255,0.08);
            padding: 100px 0 40px;
        }

        nav a {
            display: flex;
            align-items: center;
            padding: 16px 28px;
            color: rgba(255,255,255,0.75);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s;
        }
        nav a:hover { background: rgba(255,255,255,0.1); color: white; }
        nav a.active {
            background: rgba(255,255,255,0.18);
            color: white;
            font-weight: 600;
        }
        nav a svg {
            width: 22px;
            height: 22px;
            margin-right: 16px;
            fill: currentColor;
            opacity: 0.9;
            stroke: currentColor;
            stroke-width: 2;
        }

        .content {
            flex: 1;
            padding: 100px 60px 60px;
            overflow-y: auto;
        }

        .section { display: none; }
        .section.active { display: block; animation: fade 0.5s; }
        @keyframes fade { from {opacity:0; transform:translateY(20px);} }

        .card {
            background: rgba(40, 40, 55, 0.4);
            backdrop-filter: blur(30px);
            border-radius: 20px;
            padding: 32px;
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.12);
        }
        .card h2 {
            font-size: 26px;
            font-weight: 600;
            color: white;
            margin-bottom: 28px;
        }

        .setting {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 0;
        }
        .setting:not(:last-child) { border-bottom: 1px solid rgba(255,255,255,0.1); }
        .setting label { font-size: 16px; color: white; }
        .setting small { color: rgba(255,255,255,0.6); font-size: 13px; display: block; margin-top: 4px; }

        .toggle {
            appearance: none;
            width: 51px;
            height: 31px;
            background: rgba(255,255,255,0.25);
            border-radius: 20px;
            position: relative;
            cursor: pointer;
        }
        .toggle:checked { background: #0a84ff; }
        .toggle::after {
            content: "";
            position: absolute;
            width: 27px;
            height: 27px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: 0.3s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }
        .toggle:checked::after { transform: translateX(20px); }

        input[type="text"], input[type="url"], select {
            padding: 12px 18px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 14px;
            color: white;
            font-size: 15px;
            min-width: 380px;
        }
    </style>
</head>
<body>

<div class="window">
    <aside class="sidebar">
        <nav>
            <a href="#general" class="active">
                <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9,22 9,12 15,12 15,22"></polyline></svg>
                Главная
            </a>
            <a href="#history">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12,6 12,12 16,14"></polyline></svg>
                История
            </a>
            <a href="#privacy">
                <svg viewBox="0 0 24 24"><path d="M20.31 3.69L19 2.5 15.5 6.5 12 4l-3.5 2.5L5 6.5V18a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V6.5l-2.69-2.81z"></path><polyline points="12,16 12,12 13,13"></polyline></svg>
                Приватность
            </a>
            <a href="#appearance">
                <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                Внешний вид
            </a>
            <a href="#downloads">
                <svg viewBox="0 0 24 24"><polyline points="8 17 12 21 16 17"></polyline><line x1="12" y1="4" x2="12" y2="21"></line><path d="M20 16H4"></path></svg>
                Загрузки
            </a>
        </nav>
    </aside>

    <main class="content">
        <div id="general" class="section active">
            <div class="card">
                <h2>При запуске браузера</h2>
                <div class="setting">
                    <div>
                        <label>Открывать при старте</label>
                        <small>Восстановить сессию · Новая вкладка · Домашняя</small>
                    </div>
                    <select>
                        <option>Восстановить предыдущую сессию</option>
                        <option>Новую вкладку</option>
                        <option>Домашнюю страницу</option>
                    </select>
                </div>
                <div class="setting">
                    <label>Домашняя страница</label>
                    <input type="url" value="https://google.com">
                </div>
            </div>
        </div>

        <div id="history" class="section">
            <div class="card">
                <h2>История</h2>
                <div class="setting">
                    <label>Сохранять историю посещений</label>
                    <input type="checkbox" class="toggle" checked>
                </div>
                <div class="setting">
                    <label>Автоматически удалять</label>
                    <select>
                        <option>Через 3 месяца</option>
                        <option>Через 1 месяц</option>
                        <option>Никогда</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="privacy" class="section">
            <div class="card">
                <h2>Приватность</h2>
                <div class="setting">
                    <label>Блокировать сторонние куки</label>
                    <input type="checkbox" class="toggle" checked>
                </div>
            </div>
        </div>

        <div id="appearance" class="section">
            <div class="card">
                <h2>Внешний вид</h2>
                <div class="setting">
                    <label>Тёмная тема</label>
                    <input type="checkbox" class="toggle" checked disabled>
                    <small>Всегда включена</small>
                </div>
            </div>
        </div>

        <div id="downloads" class="section">
            <div class="card">
                <h2>Загрузки</h2>
                <div class="setting">
                    <label>Папка для загрузок</label>
                    <input type="text" value="~/Загрузки">
                </div>
                <div class="setting">
                    <label>Спрашивать место сохранения</label>
                    <input type="checkbox" class="toggle">
                </div>
            </div>
        </div>
    </main>
</div>

<script>
    document.querySelectorAll('nav a').forEach(link => {
        link.addEventListener('click', e => {
            e.preventDefault();
            document.querySelector('nav a.active').classList.remove('active');
            link.classList.add('active');
            document.querySelector('.section.active')?.classList.remove('active');
            document.querySelector(link.getAttribute('href')).classList.add('active');
        });
    });
</script>
</body>
</html>
