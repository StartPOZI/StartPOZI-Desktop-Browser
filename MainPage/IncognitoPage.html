<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Incognito</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:#3a3a3a;
  color:#c0c0c0;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;
  user-select:text;
  -webkit-user-select:text;
  overflow:hidden;
}
.logo{
  width:96px;height:96px;
  border-radius:50%;
  background:#4a4a4a;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:32px;
  box-shadow:0 4px 24px rgba(0,0,0,0.4);
  animation:pulse 3s ease-in-out infinite;
}
.logo svg{width:48px;height:48px;color:#a0a0a0}
@keyframes pulse{
  0%,100%{box-shadow:0 4px 24px rgba(0,0,0,0.4)}
  50%{box-shadow:0 4px 32px rgba(0,0,0,0.6)}
}
.title{
  font-size:24px;font-weight:300;color:#d0d0d0;
  margin-bottom:8px;letter-spacing:0.5px;
}
.subtitle{
  font-size:13px;color:#808080;
  max-width:480px;text-align:center;line-height:1.5;
  margin-bottom:32px;padding:0 20px;
}
.search-bar{
  width:100%;max-width:560px;padding:0 20px;
  display:flex;align-items:center;gap:10px;
  background:#4a4a4a;
  border:1px solid #5a5a5a;
  border-radius:24px;
  padding:12px 20px;
  transition:border-color 0.2s, background 0.2s;
}
.search-bar:focus-within{
  border-color:#6a6a6a;
  background:#424242;
}
.search-bar svg{width:18px;height:18px;color:#808080;flex-shrink:0}
.search-bar input{
  flex:1;background:transparent;border:none;outline:none;
  color:#d0d0d0;font-size:14px;font-family:inherit;
}
.search-bar input::placeholder{color:#707070}
.features{
  display:grid;grid-template-columns:repeat(3,1fr);gap:20px;
  max-width:600px;margin-top:48px;padding:0 20px;
}
.feature{
  display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:16px;border-radius:12px;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.05);
}
.feature svg{width:24px;height:24px;color:#909090;margin-bottom:8px}
.feature-title{font-size:12px;color:#b0b0b0;font-weight:500;margin-bottom:2px}
.feature-desc{font-size:11px;color:#707070;line-height:1.4}
</style>
</head>
<body>
<div class="logo">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="7" r="4"/>
    <path d="M5.5 21a6.5 6.5 0 0 1 13 0"/>
  </svg>
</div>
<div class="title">Incognito</div>
<div class="subtitle">You're in a private space. Cookies, cache and history are kept only for this session — when you close the tab, everything is erased.</div>

<div class="search-bar">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
  </svg>
  <input id="searchInput" type="text" placeholder="Search or enter address" autocomplete="off" spellcheck="false">
</div>

<div class="features">
  <div class="feature">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><path d="M21 12c0 4.97-4.03 9-9 9s-9-4.03-9-9 4.03-9 9-9c2.39 0 4.68.94 6.36 2.64"/></svg>
    <div class="feature-title">No traces</div>
    <div class="feature-desc">History isn't saved</div>
  </div>
  <div class="feature">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    <div class="feature-title">Isolated</div>
    <div class="feature-desc">Separate cookies & cache</div>
  </div>
  <div class="feature">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/></svg>
    <div class="feature-title">Auto-wipe</div>
    <div class="feature-desc">Cleared on tab close</div>
  </div>
</div>

<script src="../i18n.js"></script>
<script>
(function(){
  var input = document.getElementById('searchInput');
  input.focus();

  // Respect the search engine configured in Settings (falls back to the
  // browser default instead of a hardcoded Google).
  var searchBase = null;
  if (window.electronAPI && window.electronAPI.getSearchEngine) {
    window.electronAPI.getSearchEngine().then(function(engine) {
      if (engine && typeof engine === 'string' && engine.indexOf('http') === 0) searchBase = engine;
    }).catch(function() {});
  }

  function navigate(raw) {
    raw = (raw || '').trim();
    if (!raw) return;
    var isUrl = /^https?:\/\//i.test(raw) ||
                (/^[\w-]+(\.[\w-]+)+/.test(raw) && raw.indexOf(' ') === -1);
    var url;
    if (isUrl) {
      url = raw.match(/^https?:\/\//i) ? raw : 'https://' + raw;
    } else if (searchBase) {
      url = searchBase + encodeURIComponent(raw);
    } else {
      url = 'https://startpozi.netlify.app/search.html?q=' + encodeURIComponent(raw);
    }
    if (window.electronAPI && window.electronAPI.openInCurrentTab) {
      window.electronAPI.openInCurrentTab(url);
    } else {
      location.href = url;
    }
  }

  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      navigate(input.value);
    }
  });
})();
</script>
</body>
</html>
