<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- CSP: local scripts only, no remote code; connect-src limits any injected
     script to approved (or no) endpoints. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>Viewer</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico">
<style>
  :root {
    --bg: #16161e; --bg2: #1d1d27; --bg3: #262633;
    --fg: #e8e8ef; --fg-dim: #9a9aa8; --accent: #1da1f2;
    --border: rgba(255,255,255,0.09); --sel: rgba(29,161,242,0.25);
    --ok: #4caf50; --err: #ef5350; --warn: #ffb300;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; background: var(--bg2);
    border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  .v-type-badge {
    font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; padding: 3px 8px; border-radius: 6px;
    background: rgba(29,161,242,0.15); color: var(--accent);
  }
  #vPath {
    flex: 1; min-width: 200px; font-size: 12px; color: var(--fg-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    direction: rtl; text-align: left;
  }
  #vMeta { font-size: 11px; color: var(--fg-dim); white-space: nowrap; }
  .hbtn {
    background: var(--bg3); color: var(--fg); border: 1px solid var(--border);
    border-radius: 7px; padding: 5px 12px; font-size: 12px; cursor: pointer;
  }
  .hbtn:hover { border-color: var(--accent); color: var(--accent); }
  .hbtn.active { background: rgba(29,161,242,0.18); color: var(--accent); border-color: var(--accent); }
  input[type="text"] {
    background: var(--bg3); border: 1px solid var(--border); border-radius: 7px;
    color: var(--fg); font-size: 12px; padding: 5px 10px; outline: none; width: 180px;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  main { flex: 1; overflow: auto; position: relative; }

  /* JSON tree */
  .json-tree { padding: 12px 16px; font: 12.5px/1.6 "SF Mono", Consolas, Menlo, monospace; }
  .json-tree details { margin-left: 18px; }
  .json-tree > details, .json-tree > .jv { margin-left: 0; }
  .json-tree summary {
    cursor: pointer; list-style: none; user-select: none; border-radius: 4px;
    padding: 0 4px; margin-left: -4px;
  }
  .json-tree summary::-webkit-details-marker { display: none; }
  .json-tree summary:hover { background: rgba(255,255,255,0.05); }
  .json-tree summary::before { content: "▸"; color: var(--fg-dim); margin-right: 5px; display: inline-block; transition: transform .1s; }
  .json-tree details[open] > summary::before { transform: rotate(90deg); }
  .jv-key { color: #7fd1f7; } .jv-str { color: #a5e07f; } .jv-num { color: #f2b37c; }
  .jv-bool { color: #e08ef0; } .jv-null { color: #9a9aa8; font-style: italic; }
  .jv-count { color: var(--fg-dim); font-size: 11px; margin-left: 6px; }
  .jv-hidden { display: none; }
  mark { background: var(--sel); color: inherit; border-radius: 2px; }

  /* Markdown */
  .md-body { max-width: 860px; margin: 0 auto; padding: 28px 32px 80px; font-size: 15px; }
  .md-body h1, .md-body h2 { border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  .md-body h1:first-child { margin-top: 0; }
  .md-body pre {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; overflow: auto; font-size: 13px;
  }
  .md-body code { background: var(--bg2); border-radius: 4px; padding: 1px 5px; font-size: 0.9em; }
  .md-body pre code { background: none; padding: 0; }
  .md-body blockquote { border-left: 3px solid var(--accent); margin: 0; padding: 2px 14px; color: var(--fg-dim); background: var(--bg2); border-radius: 0 8px 8px 0; }
  .md-body img { max-width: 100%; border-radius: 8px; }
  .md-body table { border-collapse: collapse; }
  .md-body th, .md-body td { border: 1px solid var(--border); padding: 5px 12px; }
  .md-body a { color: var(--accent); }
  .md-body hr { border: none; border-top: 1px solid var(--border); }

  /* Image */
  .img-stage {
    display: flex; align-items: center; justify-content: center; min-height: 100%;
    background:
      repeating-conic-gradient(rgba(255,255,255,0.045) 0% 25%, transparent 0% 50%)
      50% / 24px 24px, var(--bg2);
    overflow: hidden; padding: 20px;
  }
  .img-stage img { image-rendering: auto; transition: transform .12s; max-width: none; }
  .img-empty { color: var(--fg-dim); font-size: 13px; }

  /* Font */
  .font-body { padding: 24px 32px; }
  .font-sample-line { margin: 6px 0; color: var(--fg); white-space: nowrap; overflow: hidden; }
  .font-alpha { margin-top: 18px; font-size: 22px; line-height: 1.9; word-break: break-all; color: var(--fg-dim); }
  .font-info { color: var(--fg-dim); font-size: 12px; margin-top: 16px; }

  #vError { padding: 40px; text-align: center; color: var(--err); font-size: 14px; }
</style>
</head>
<body>
  <header>
    <span class="v-type-badge" id="vBadge">FILE</span>
    <span id="vPath" title="">—</span>
    <span id="vMeta"></span>
    <span style="flex:1"></span>
    <span id="vTools" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
      <input type="text" id="vSearch" placeholder="Filter..." style="display:none;">
      <button class="hbtn" id="vCopy" style="display:none;">Copy</button>
      <button class="hbtn" id="vWrap" style="display:none;">Wrap</button>
      <button class="hbtn" id="vFit" style="display:none;">Fit</button>
      <button class="hbtn" id="v100" style="display:none;">100%</button>
      <button class="hbtn" id="vZoomOut" style="display:none;">−</button>
      <button class="hbtn" id="vZoomIn" style="display:none;">+</button>
      <button class="hbtn" id="vRotate" style="display:none;">Rotate</button>
    </span>
  </header>
  <main id="vMain"><div id="vError">Loading…</div></main>
<script src="i18n.js"></script>
<script src="Viewer-inline.js"></script>
</body>
</html>
