<!DOCTYPE html>
<html lang="en">
<!-- spz-widget:digital_datetime -->
<head>
    <meta charset="UTF-8">
    <title>Digital time &amp; date | Widget</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; background: transparent; overflow: hidden; }
        body {
            display: flex; align-items: center; justify-content: center;
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
        }
        #spz-root {
            width: 190px; height: 90px;
            transform-origin: center center;
            text-align: center;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 5px;
        }
        .time {
            font-size: 34px; font-weight: 600; line-height: 1;
            letter-spacing: 1px;
            font-variant-numeric: tabular-nums;
        }
        .time .sec { font-size: 19px; font-weight: 500; color: rgba(255,255,255,0.45); margin-left: 4px; }
        .date {
            font-size: 12px; color: rgba(255,255,255,0.6);
            text-transform: capitalize;
        }
        .tick { width: 18px; height: 2px; border-radius: 2px; background: rgba(76,201,240,0.7); }
    </style>
</head>
<body>
<div id="spz-root">
    <div class="time"><span id="hm">--:--</span><span class="sec" id="sec">--</span></div>
    <div class="tick"></div>
    <div class="date" id="dateLine">&nbsp;</div>
</div>
<script>
    (function () {
        var W = 190, H = 90;
        function fit() {
            var s = Math.min(window.innerWidth / W, window.innerHeight / H, 1);
            document.getElementById('spz-root').style.transform = 'scale(' + s + ')';
        }
        window.addEventListener('resize', fit); fit();
    })();
</script>
<script>
    var LANG = (window.__SPZ_LANG || (navigator.language || 'en').slice(0, 2).toLowerCase()) === 'ru' ? 'ru' : 'en';
    var locale = LANG === 'ru' ? 'ru-RU' : 'en-GB';
    var fmt = new Intl.DateTimeFormat(locale, { weekday: 'long', day: 'numeric', month: 'long' });

    function pad(n) { return (n < 10 ? '0' : '') + n; }
    function update() {
        var now = new Date();
        document.getElementById('hm').textContent = pad(now.getHours()) + ':' + pad(now.getMinutes());
        document.getElementById('sec').textContent = pad(now.getSeconds());
        var s = fmt.format(now);
        document.getElementById('dateLine').textContent = s.charAt(0).toUpperCase() + s.slice(1);
    }
    update();
    setInterval(update, 1000);
</script>
</body>
</html>
