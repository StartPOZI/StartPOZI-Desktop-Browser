<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analog clock | Widget</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 30% 20%, #1e2a3a, #0a0f18);
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        /* Widget – fully transparent background, content only */
        .widget {
            background: transparent;
            border-radius: 2rem;
            padding: 1.8rem 1.5rem;
            text-align: center;
            box-shadow: 0 20px 35px rgba(0,0,0,0.2), 0 0 0 1px rgba(255,255,200,0.1);
            backdrop-filter: blur(0px);
            transition: transform 0.2s;
            max-width: 320px;
            width: 100%;
        }
        .widget:hover {
            transform: translateY(-5px);
        }
        .widget-title {
            font-size: 1.7rem;
            font-weight: 600;
            background: linear-gradient(135deg, #FFF2D7, #D4E0FF);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.3rem;
        }
        .widget-desc {
            font-size: 0.8rem;
            color: #ccddee;
            opacity: 0.8;
            margin-bottom: 1.2rem;
            border-left: 2px solid #ffc285;
            padding-left: 0.7rem;
            text-align: left;
        }
        canvas {
            display: block;
            margin: 0 auto;
            background: transparent;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
            width: 200px;
            height: 200px;
        }
        .footnote {
            font-size: 0.7rem;
            color: #aab9d4;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
<div class="widget">
    <div class="widget-title">⌛ Classic dial</div>
    <div class="widget-desc">Elegant hands, ticking seconds. Perfect for the start screen.</div>
    <canvas id="clockCanvas" width="200" height="200"></canvas>
    <div class="footnote">time moves forward</div>
</div>
<script>
    const canvas = document.getElementById('clockCanvas');
    const ctx = canvas.getContext('2d');

    function drawClock() {
        const now = new Date();
        const hours = now.getHours() % 12;
        const minutes = now.getMinutes();
        const seconds = now.getSeconds();

        const radius = canvas.width / 2;
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(cx, cy);

        // Dial
        ctx.beginPath();
        ctx.arc(0, 0, radius * 0.88, 0, 2 * Math.PI);
        ctx.strokeStyle = 'rgba(255,250,210,0.85)';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Marks and numbers
        for (let i = 1; i <= 12; i++) {
            let angle = i * Math.PI / 6 - Math.PI / 2;
            let x1 = (radius - 8) * Math.cos(angle);
            let y1 = (radius - 8) * Math.sin(angle);
            let x2 = (radius - 20) * Math.cos(angle);
            let y2 = (radius - 20) * Math.sin(angle);
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.strokeStyle = '#fffaec';
            ctx.stroke();

            ctx.font = `bold ${Math.floor(radius * 0.12)}px "Segoe UI"`;
            ctx.fillStyle = '#F5E6C4';
            let numX = (radius - 32) * Math.cos(angle);
            let numY = (radius - 32) * Math.sin(angle);
            ctx.fillText(i.toString(), numX - 6, numY + 6);
        }

        // Hour hand
        let hourAngle = (hours * 30 + minutes * 0.5) * Math.PI / 180;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(radius * 0.5 * Math.cos(hourAngle), radius * 0.5 * Math.sin(hourAngle));
        ctx.lineWidth = 5;
        ctx.strokeStyle = '#FFD966';
        ctx.stroke();

        // Minute hand
        let minuteAngle = (minutes * 6) * Math.PI / 180;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(radius * 0.72 * Math.cos(minuteAngle), radius * 0.72 * Math.sin(minuteAngle));
        ctx.lineWidth = 3.5;
        ctx.strokeStyle = '#F5CCA0';
        ctx.stroke();

        // Second hand
        let secondAngle = (seconds * 6) * Math.PI / 180;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(radius * 0.82 * Math.cos(secondAngle), radius * 0.82 * Math.sin(secondAngle));
        ctx.lineWidth = 1.8;
        ctx.strokeStyle = '#FFAA66';
        ctx.stroke();

        // Center
        ctx.beginPath();
        ctx.arc(0, 0, 5, 0, 2 * Math.PI);
        ctx.fillStyle = '#FFD966';
        ctx.fill();
        ctx.restore();
    }

    drawClock();
    setInterval(drawClock, 1000);
</script>
</body>
</html>
