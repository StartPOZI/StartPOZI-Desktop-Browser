<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>StartPOZI Browser</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .toolbar {
      height: 56px;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid #252525;
      position: relative;
    }

    .nav-buttons { display: flex; gap: 8px; }

    .nav-btn {
      width: 40px; height: 40px;
      background: rgba(255,255,255,0.06);
      border: none; border-radius: 10px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .nav-btn:hover { background: rgba(255,255,255,0.14); }

    /* ПОИСК — ТОЧНО ПО ЦЕНТРУ, ЧУТЬ МЕНЬШЕ, БЕЗ ЛУПЫ */
    .search-bar {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      max-width: 620px;
      pointer-events: auto;
    }

    #searchInput {
      width: 100%;
      height: 40px;
      padding: 0 20px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 13px;
      color: white;
      font-size: 15px;
      outline: none;
      text-align: center;
    }
    #searchInput::placeholder {
      color: rgba(255,255,255,0.45);
      text-align: center;
    }
    #searchInput:focus::placeholder { opacity: 0; }

    #menuBtn {
      width: 44px; height: 44px;
      background: rgba(255,255,255,0.07);
      border: none; border-radius: 14px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    #menuBtn:hover { background: rgba(255,255,255,0.16); }

    .dropdown {
      position: absolute;
      top: 68px;
      right: 18px;
      background: rgba(20,20,20,0.98);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      width: 260px;
      display: none;
      z-index: 99999;
    }
    .dropdown.show { display: block; }

    svg { stroke: white !important; fill: none; }
    .nav-btn svg, #menuBtn svg { width: 18px; height: 18px; stroke-width: 2.2; }
  </style>
</head>
<body>
  <div class="container">
    <div class="custom-titlebar macos" id="customTitlebar">
      <div class="window-controls">
        <button id="min-btn" title="Свернуть"></button>
        <button id="max-btn" title="На весь экран"></button>
        <button id="close-btn" title="Закрыть"></button>
      </div>
    </div>

    <div class="tabs" id="tabsContainerTabs">
      <button id="addTab" title="Новая вкладка">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </div>

    <div class="toolbar">
      <div class="nav-buttons">
        <button class="nav-btn" id="back"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12,19 5,12 12,5"></polyline></svg></button>
        <button class="nav-btn" id="forward"><svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12,5 19,12 12,19"></polyline></svg></button>
        <button class="nav-btn" id="refresh"><svg viewBox="0 0 24 24"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"></path><path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"></path></svg></button>
      </div>


      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Поиск или адрес..." autocomplete="off">
      </div>

      <button id="menuBtn">
        <svg viewBox="0 0 24 24">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="tabs-container" id="tabsContainer"></div>

    <div class="dropdown" id="dropdown">
      <div class="menu-item" data-action="bookmarks">Закладки</div>
      <div class="menu-item" data-action="downloads">Загрузки</div>
      <div class="menu-item" data-action="history">История</div>
      <div class="separator"></div>
      <div class="menu-item" data-action="about">О браузере</div>
      <div class="separator"></div>
      <div class="menu-item" data-action="settings">Настройки</div>
    </div>
  </div>

  <script src="renderer.js"></script>
  <script>
    // Меню работает
    document.getElementById('menuBtn').onclick = (e) => {
      e.stopPropagation();
      document.getElementById('dropdown').classList.toggle('show');
    };
    document.addEventListener('click', (e) => {
      const menu = document.getElementById('dropdown');
      const btn = document.getElementById('menuBtn');
      if (!btn.contains(e.target) && !menu.contains(e.target)) menu.classList.remove('show');
    });

    // Поиск работает по Enter
    document.getElementById('searchInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const query = e.target.value.trim();
        if (!query) return;

        let url = query;
        if (!url.match(/^https?:\/\//i)) {
          if (url.includes('.')) {
            url = 'https://' + url;
          } else {
            const engine = localStorage.getItem('searchEngineUrl') || 'https://www.google.com/search?q=';
            url = engine + encodeURIComponent(url);
          }
        }

        const activeWebview = document.querySelector('.tab-content.active webview');
        if (activeWebview) activeWebview.loadURL(url);
      }
    });
  </script>
</body>
</html>
